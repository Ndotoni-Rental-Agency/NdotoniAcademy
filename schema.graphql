schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Course {
  category: String
  createdAt: AWSDateTime!
  description: String
  id: ID!
  instructor: User
  instructorUserId: ID!
  organization: Organization
  organizationId: ID
  priceTzs: Int!
  status: CourseStatus!
  thumbnailUrl: AWSURL
  title: String!
  updatedAt: AWSDateTime!
}

type CourseCertificate {
  category: String
  courseId: ID!
  courseTitle: String!
  holder: User!
  id: ID!
  instructor: User
  issuedAt: AWSDateTime!
  totalLessons: Int!
}

type CourseLearningSummary {
  category: String
  completedLessonCount: Int!
  courseId: ID!
  lastActivityAt: AWSDateTime!
  resumeLessonId: ID
  resumeModuleId: ID
  thumbnailUrl: AWSURL
  title: String!
  totalLessons: Int!
}

type CourseModule {
  courseId: ID!
  createdAt: AWSDateTime!
  description: String
  isFree: Boolean!
  lessonCount: Int!
  moduleId: ID!
  order: Int!
  thumbnailUrl: AWSURL
  title: String!
  totalDurationSeconds: Int!
}

type CourseProgress {
  completedLessonIds: [ID!]!
  courseId: ID!
  totalLessons: Int!
}

type Flashcard {
  back: String!
  backMedia: Media
  front: String!
  frontMedia: Media
  id: ID!
}

type Lesson {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [Flashcard!]
  createdAt: AWSDateTime!
  document: Media
  durationSeconds: Int
  embedUrl: AWSURL
  id: ID!
  instructorUserId: ID!
  organizationId: ID
  questions: [QuizQuestion!]
  title: String!
  type: LessonType!
  updatedAt: AWSDateTime!
  videoUrl: AWSURL
}

type Media {
  type: MediaType!
  url: AWSURL!
}

type MediaUploadResponse {
  fileUrl: AWSURL!
  key: String!
  uploadUrl: AWSURL!
}

type Module {
  createdAt: AWSDateTime!
  description: String
  id: ID!
  instructorUserId: ID!
  organizationId: ID
  thumbnailUrl: AWSURL
  title: String!
  updatedAt: AWSDateTime!
}

type ModuleLesson {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [Flashcard!]
  createdAt: AWSDateTime!
  document: Media
  durationSeconds: Int
  embedUrl: AWSURL
  isFree: Boolean!
  lessonId: ID!
  moduleId: ID!
  order: Int!
  prerequisites: [ModuleLessonRef!]!
  questions: [QuizQuestion!]
  title: String!
  type: LessonType!
  videoUrl: AWSURL
}

type ModuleLessonRef {
  lessonId: ID!
  moduleId: ID!
}

type ModuleLessonSummary {
  createdAt: AWSDateTime!
  durationSeconds: Int
  isFree: Boolean!
  lessonId: ID!
  moduleId: ID!
  order: Int!
  prerequisites: [ModuleLessonRef!]!
  title: String!
  type: LessonType!
}

type Mutation {
  acceptInvitation(token: String!): OrganizationMembership 
  addLessonToModule(courseId: ID!, lessonId: ID!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]): ModuleLesson! 
  addModuleToCourse(courseId: ID!, moduleId: ID!): CourseModule! 
  applyToBeInstructor: User 
  changeMemberRole(organizationId: ID!, role: MembershipRole!, userId: ID!): OrganizationMembership 
  createCourse(input: CreateCourseInput!): Course! 
  createLessonForModule(courseId: ID!, input: CreateLessonInput!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]): ModuleLesson! 
  createModuleForCourse(courseId: ID!, input: CreateModuleInput!): CourseModule! 
  createOrganization(input: CreateOrganizationInput!): Organization 
  deleteCourse(id: ID!): Boolean 
  deleteLesson(id: ID!): Boolean 
  deleteModule(id: ID!): Boolean 
  generateFlashcardsFromText(count: Int, text: String!): [Flashcard!]! 
  generateQuizFromText(count: Int, text: String!): [QuizQuestion!]! 
  getCourseMediaUploadUrl(contentType: String!, fileName: String!): MediaUploadResponse! 
  inviteMember(email: AWSEmail!, organizationId: ID!, role: MembershipRole!): OrganizationInvitation 
  markLessonComplete(courseId: ID!, lessonId: ID!): CourseProgress! 
  removeLessonFromModule(lessonId: ID!, moduleId: ID!): Boolean 
  removeMember(organizationId: ID!, userId: ID!): Boolean 
  removeModuleFromCourse(courseId: ID!, moduleId: ID!): Boolean 
  reorderCourseModules(courseId: ID!, moduleIds: [ID!]!): [CourseModule!]! 
  reorderModuleLessons(courseId: ID!, lessonIds: [ID!]!, moduleId: ID!): [ModuleLessonSummary!]! 
  requestInstructorRole(organizationId: ID!): OrganizationMembership 
  revokeInvitation(email: AWSEmail!, organizationId: ID!): Boolean 
  setInstructorStatus(status: InstructorStatus!, userId: ID!): User 
  setModuleLessonPrerequisites(courseId: ID!, lessonId: ID!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]!): ModuleLesson! 
  transcribeDocument(fileUrl: AWSURL!): String! 
  updateCourse(id: ID!, input: UpdateCourseInput!): Course! 
  updateLesson(id: ID!, input: UpdateLessonInput!): Lesson! 
  updateModule(id: ID!, input: UpdateModuleInput!): Module! 
  updateProfile(input: UpdateUserProfileInput!): User 
}

type Organization {
  createdAt: AWSDateTime!
  id: ID!
  members: [OrganizationMembership!]
  name: String!
  slug: String!
  status: OrganizationStatus!
  type: OrganizationType!
}

type OrganizationInvitation {
  createdAt: AWSDateTime!
  email: AWSEmail!
  expiresAt: AWSDateTime!
  id: ID!
  organization: Organization
  organizationId: ID!
  role: MembershipRole!
  status: InvitationStatus!
}

type OrganizationMembership {
  id: ID!
  joinedAt: AWSDateTime
  organization: Organization
  organizationId: ID!
  permissions: [String!]!
  role: MembershipRole!
  status: MembershipStatus!
  user: User
  userId: ID!
  wantsToBeInstructor: Boolean!
}

type Query {
  certificateByPublicId(id: ID!): CourseCertificate 
  course(id: ID!): Course 
  coursesForOrganization(organizationId: ID!): [Course!]! 
  invitationsForOrganization(organizationId: ID!): [OrganizationInvitation!]! 
  lesson(courseId: ID!, lessonId: ID!, moduleId: ID!): ModuleLesson 
  lessonsForModule(courseId: ID!, moduleId: ID!): [ModuleLessonSummary!]! 
  me: User 
  module(id: ID!): Module 
  modulesForCourse(courseId: ID!): [CourseModule!]! 
  myCertificates: [CourseCertificate!]! 
  myCourseProgress(courseId: ID!): CourseProgress! 
  myCourses: [Course!]! 
  myLearning: [CourseLearningSummary!]! 
  myLessons: [Lesson!]! 
  myModules: [Module!]! 
  organization(id: ID!): Organization 
  organizationBySlug(slug: String!): Organization 
  publicCourses: [Course!]! 
}

type QuizQuestion {
  correctIndex: Int!
  id: ID!
  options: [String!]!
  question: String!
}

type Subscription {
  organizationMemberJoined(organizationId: ID!): OrganizationMembership  
}

type User {
  avatarUrl: AWSURL
  createdAt: AWSDateTime!
  email: AWSEmail!
  firstName: String
  id: ID!
  instructorStatus: InstructorStatus
  lastName: String
  organizations: [OrganizationMembership!]!
  status: UserStatus!
  updatedAt: AWSDateTime!
}

enum CourseStatus {
  DRAFT
  PUBLISHED
}

enum InstructorStatus {
  APPROVED
  PENDING
  REJECTED
}

enum InvitationStatus {
  ACCEPTED
  EXPIRED
  PENDING
}

enum LessonType {
  ANIMATION
  AUDIO
  DOCUMENT
  EMBED
  FLASHCARDS
  QUIZ
  TEXT
  VIDEO
}

enum MediaType {
  AUDIO
  DOCUMENT
  IMAGE
  VIDEO
}

enum MembershipRole {
  ADMIN
  INSTRUCTOR
  MEMBER
  OWNER
}

enum MembershipStatus {
  ACTIVE
  INVITED
  REMOVED
}

enum OrganizationStatus {
  ACTIVE
  PENDING
  SUSPENDED
}

enum OrganizationType {
  COMPANY
  GOVERNMENT
  NGO
  OTHER
  SCHOOL
}

enum UserStatus {
  ACTIVE
  SUSPENDED
}

input CreateCourseInput {
  category: String
  description: String
  organizationId: ID
  priceTzs: Int!
  thumbnailUrl: AWSURL
  title: String!
}

input CreateLessonInput {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [FlashcardInput!]
  document: MediaInput
  durationSeconds: Int
  embedUrl: AWSURL
  organizationId: ID
  questions: [QuizQuestionInput!]
  title: String!
  type: LessonType!
  videoUrl: AWSURL
}

input CreateModuleInput {
  description: String
  organizationId: ID
  thumbnailUrl: AWSURL
  title: String!
}

input CreateOrganizationInput {
  name: String!
  slug: String!
  type: OrganizationType!
}

input FlashcardInput {
  back: String!
  backMedia: MediaInput
  front: String!
  frontMedia: MediaInput
  id: ID!
}

input MediaInput {
  type: MediaType!
  url: AWSURL!
}

input ModuleLessonRefInput {
  lessonId: ID!
  moduleId: ID!
}

input QuizQuestionInput {
  correctIndex: Int!
  id: ID!
  options: [String!]!
  question: String!
}

input UpdateCourseInput {
  category: String
  description: String
  priceTzs: Int
  status: CourseStatus
  thumbnailUrl: AWSURL
  title: String
}

input UpdateLessonInput {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [FlashcardInput!]
  document: MediaInput
  durationSeconds: Int
  embedUrl: AWSURL
  questions: [QuizQuestionInput!]
  title: String
  videoUrl: AWSURL
}

input UpdateModuleInput {
  description: String
  thumbnailUrl: AWSURL
  title: String
}

input UpdateUserProfileInput {
  avatarUrl: AWSURL
  firstName: String
  lastName: String
}
