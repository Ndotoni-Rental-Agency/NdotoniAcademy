  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [FlashcardInput!]
  document: MediaInput
  durationSeconds: Int
  embedUrl: AWSURL
  questions: [QuizQuestionInput!]
  title: String
  videoUrl: AWSURL
}

