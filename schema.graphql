  body: String
  cards: [FlashcardInput!]
  document: MediaInput
  durationSeconds: Int
  embedUrl: AWSURL
  organizationId: ID
  questions: [QuizQuestionInput!]
  title: String!
  type: LessonType!
  videoUrl: AWSURL
}

input CreateModuleInput {
  description: String
  organizationId: ID
  thumbnailUrl: AWSURL
  title: String!
}

input CreateOrganizationInput {
  name: String!
  slug: String!
  type: OrganizationType!
}

input FlashcardInput {
  back: String!
  backMedia: MediaInput
  front: String!
  frontMedia: MediaInput
  id: ID!
}

input GradeAssignmentInput {
  feedback: String
  score: Int!
}

input MediaInput {
  type: MediaType!
  url: AWSURL!
}

input ModuleLessonRefInput {
  lessonId: ID!
  moduleId: ID!
}

input QuizQuestionInput {
  correctIndex: Int!
  id: ID!
  options: [String!]!
  question: String!
}

input SetCourseExamInput {
  passingScorePercent: Int!
  questions: [QuizQuestionInput!]!
}

input SubmitAssignmentInput {
  attachment: MediaInput
  body: String
}

input UpdateAssignmentInput {
  description: String
  title: String
}

input UpdateCourseInput {
  category: String
  description: String
  priceTzs: Int
  status: CourseStatus
