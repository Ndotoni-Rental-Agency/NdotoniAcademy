schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Assignment {
  courseId: ID!
  createdAt: AWSDateTime!
  description: String
  id: ID!
  title: String!
  updatedAt: AWSDateTime!
}

type AssignmentSubmission {
  assignmentId: ID!
  attachment: Media
  body: String
  courseId: ID!
  feedback: String
  gradedAt: AWSDateTime
  score: Int
  status: SubmissionStatus!
  submittedAt: AWSDateTime!
  submitterName: String!
  userId: ID!
}

type Course {
  category: String
  createdAt: AWSDateTime!
  description: String
  id: ID!
  instructor: User
  instructorUserId: ID!
  organization: Organization
  organizationId: ID
  priceTzs: Int!
  status: CourseStatus!
  thumbnailUrl: AWSURL
  title: String!
  updatedAt: AWSDateTime!
}

type CourseCertificate {
  category: String
  courseId: ID!
  courseTitle: String!
  holderName: String!
  id: ID!
  instructorName: String
  issuedAt: AWSDateTime!
  totalLessons: Int!
}

type CourseExam {
  courseId: ID!
  passingScorePercent: Int!
  questions: [QuizQuestion!]!
  updatedAt: AWSDateTime!
}

type CourseExamPreview {
  courseId: ID!
  passingScorePercent: Int!
  questions: [ExamQuestionPreview!]!
}

type CourseLearningSummary {
  category: String
  completedLessonCount: Int!
  courseId: ID!
  lastActivityAt: AWSDateTime!
  resumeLessonId: ID
  resumeModuleId: ID
  thumbnailUrl: AWSURL
  title: String!
  totalLessons: Int!
}

type CourseModule {
  courseId: ID!
  createdAt: AWSDateTime!
  description: String
  isFree: Boolean!
  lessonCount: Int!
  moduleId: ID!
  order: Int!
  thumbnailUrl: AWSURL
  title: String!
  totalDurationSeconds: Int!
}

type CourseProgress {
  completedLessonIds: [ID!]!
  courseId: ID!
  totalLessons: Int!
}

type DiscussionPost {
  authorId: ID!
  authorName: String!
  body: String!
  courseId: ID!
  createdAt: AWSDateTime!
  id: ID!
  parentPostId: ID
}

type ExamAttempt {
  attemptedAt: AWSDateTime!
  courseId: ID!
  passed: Boolean!
  score: Int!
  total: Int!
}

type ExamQuestionPreview {
  id: ID!
  options: [String!]!
  question: String!
}

type Flashcard {
  back: String!
  backMedia: Media
  front: String!
  frontMedia: Media
  id: ID!
}

type Lesson {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [Flashcard!]
  createdAt: AWSDateTime!
  document: Media
  durationSeconds: Int
  embedUrl: AWSURL
  id: ID!
  instructorUserId: ID!
  organizationId: ID
  questions: [QuizQuestion!]
  title: String!
  type: LessonType!
  updatedAt: AWSDateTime!
  videoUrl: AWSURL
}

type Media {
  type: MediaType!
  url: AWSURL!
}

type MediaUploadResponse {
  fileUrl: AWSURL!
  key: String!
  uploadUrl: AWSURL!
}

type Module {
  createdAt: AWSDateTime!
  description: String
  id: ID!
  instructorUserId: ID!
  organizationId: ID
  thumbnailUrl: AWSURL
  title: String!
  updatedAt: AWSDateTime!
}

type ModuleLesson {
  animationRef: String
  audioUrl: AWSURL
  body: String
  cards: [Flashcard!]
  createdAt: AWSDateTime!
  document: Media
  durationSeconds: Int
  embedUrl: AWSURL
  isFree: Boolean!
  lessonId: ID!
  moduleId: ID!
  order: Int!
  prerequisites: [ModuleLessonRef!]!
  questions: [QuizQuestion!]
  title: String!
  type: LessonType!
  videoUrl: AWSURL
}

type ModuleLessonRef {
  lessonId: ID!
  moduleId: ID!
}

type ModuleLessonSummary {
  createdAt: AWSDateTime!
  durationSeconds: Int
  isFree: Boolean!
  lessonId: ID!
  moduleId: ID!
  order: Int!
  prerequisites: [ModuleLessonRef!]!
  title: String!
  type: LessonType!
}

type Mutation {
  acceptInvitation(token: String!): OrganizationMembership @aws_cognito_user_pools
  addLessonToModule(courseId: ID!, lessonId: ID!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]): ModuleLesson! @aws_cognito_user_pools
  addModuleToCourse(courseId: ID!, moduleId: ID!): CourseModule! @aws_cognito_user_pools
  applyToBeInstructor: User @aws_cognito_user_pools
  beautifyLessonMarkdown(text: String!): String! @aws_cognito_user_pools
  changeMemberRole(organizationId: ID!, role: MembershipRole!, userId: ID!): OrganizationMembership @aws_cognito_user_pools
  createAssignment(courseId: ID!, input: CreateAssignmentInput!): Assignment! @aws_cognito_user_pools
  createCourse(input: CreateCourseInput!): Course! @aws_cognito_user_pools
  createDiscussionPost(courseId: ID!, input: CreateDiscussionPostInput!): DiscussionPost! @aws_cognito_user_pools
  createLessonForModule(courseId: ID!, input: CreateLessonInput!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]): ModuleLesson! @aws_cognito_user_pools
  createModuleForCourse(courseId: ID!, input: CreateModuleInput!): CourseModule! @aws_cognito_user_pools
  createOrganization(input: CreateOrganizationInput!): Organization @aws_cognito_user_pools
  deleteAssignment(courseId: ID!, id: ID!): Boolean @aws_cognito_user_pools
  deleteCourse(id: ID!): Boolean @aws_cognito_user_pools
  deleteCourseExam(courseId: ID!): Boolean @aws_cognito_user_pools
  deleteDiscussionPost(courseId: ID!, id: ID!): Boolean @aws_cognito_user_pools
  deleteLesson(id: ID!): Boolean @aws_cognito_user_pools
  deleteModule(id: ID!): Boolean @aws_cognito_user_pools
  generateFlashcardsFromText(count: Int, text: String!): [Flashcard!]! @aws_cognito_user_pools
  generateQuizFromText(count: Int, text: String!): [QuizQuestion!]! @aws_cognito_user_pools
  getCourseMediaUploadUrl(contentType: String!, fileName: String!): MediaUploadResponse! @aws_cognito_user_pools
  gradeAssignment(assignmentId: ID!, courseId: ID!, input: GradeAssignmentInput!, userId: ID!): AssignmentSubmission! @aws_cognito_user_pools
  inviteMember(email: AWSEmail!, organizationId: ID!, role: MembershipRole!): OrganizationInvitation @aws_cognito_user_pools
  markLessonComplete(courseId: ID!, lessonId: ID!): CourseProgress! @aws_cognito_user_pools
  removeLessonFromModule(lessonId: ID!, moduleId: ID!): Boolean @aws_cognito_user_pools
  removeMember(organizationId: ID!, userId: ID!): Boolean @aws_cognito_user_pools
  removeModuleFromCourse(courseId: ID!, moduleId: ID!): Boolean @aws_cognito_user_pools
  reorderCourseModules(courseId: ID!, moduleIds: [ID!]!): [CourseModule!]! @aws_cognito_user_pools
  reorderModuleLessons(courseId: ID!, lessonIds: [ID!]!, moduleId: ID!): [ModuleLessonSummary!]! @aws_cognito_user_pools
  requestInstructorRole(organizationId: ID!): OrganizationMembership @aws_cognito_user_pools
  revokeInvitation(email: AWSEmail!, organizationId: ID!): Boolean @aws_cognito_user_pools
  setCourseExam(courseId: ID!, input: SetCourseExamInput!): CourseExam! @aws_cognito_user_pools
  setInstructorStatus(status: InstructorStatus!, userId: ID!): User @aws_cognito_user_pools
  setModuleLessonPrerequisites(courseId: ID!, lessonId: ID!, moduleId: ID!, prerequisites: [ModuleLessonRefInput!]!): ModuleLesson! @aws_cognito_user_pools
  submitAssignment(assignmentId: ID!, courseId: ID!, input: SubmitAssignmentInput!): AssignmentSubmission! @aws_cognito_user_pools
  submitExamAttempt(answers: [Int!]!, courseId: ID!): ExamAttempt! @aws_cognito_user_pools
  transcribeDocument(fileUrl: AWSURL!): String! @aws_cognito_user_pools
  updateAssignment(courseId: ID!, id: ID!, input: UpdateAssignmentInput!): Assignment! @aws_cognito_user_pools
  updateCourse(id: ID!, input: UpdateCourseInput!): Course! @aws_cognito_user_pools
  updateLesson(id: ID!, input: UpdateLessonInput!): Lesson! @aws_cognito_user_pools
  updateModule(id: ID!, input: UpdateModuleInput!): Module! @aws_cognito_user_pools
  updateProfile(input: UpdateUserProfileInput!): User @aws_cognito_user_pools
}

type Organization {
  createdAt: AWSDateTime!
  id: ID!
  members: [OrganizationMembership!]
  name: String!
  slug: String!
  status: OrganizationStatus!
  type: OrganizationType!
}

type OrganizationInvitation {
  createdAt: AWSDateTime!
  email: AWSEmail!
  expiresAt: AWSDateTime!
  id: ID!
  organization: Organization
  organizationId: ID!
  role: MembershipRole!
  status: InvitationStatus!
}

type OrganizationMembership {
  id: ID!
  joinedAt: AWSDateTime
  organization: Organization
  organizationId: ID!
  permissions: [String!]!
  role: MembershipRole!
  status: MembershipStatus!
  user: User
  userId: ID!
  wantsToBeInstructor: Boolean!
}

type Query {
  assignmentsForCourse(courseId: ID!): [Assignment!]! @aws_cognito_user_pools
  certificateByPublicId(id: ID!): CourseCertificate @aws_cognito_user_pools
  course(id: ID!): Course @aws_cognito_user_pools
  courseExam(courseId: ID!): CourseExam @aws_cognito_user_pools
  coursesForOrganization(organizationId: ID!): [Course!]! @aws_cognito_user_pools
  discussionForCourse(courseId: ID!): [DiscussionPost!]! @aws_cognito_user_pools
  examToTake(courseId: ID!): CourseExamPreview @aws_cognito_user_pools
  invitationsForOrganization(organizationId: ID!): [OrganizationInvitation!]! @aws_cognito_user_pools
  lesson(courseId: ID!, lessonId: ID!, moduleId: ID!): ModuleLesson @aws_cognito_user_pools
  lessonsForModule(courseId: ID!, moduleId: ID!): [ModuleLessonSummary!]! @aws_cognito_user_pools
  me: User @aws_cognito_user_pools
  module(id: ID!): Module @aws_cognito_user_pools
  modulesForCourse(courseId: ID!): [CourseModule!]! @aws_cognito_user_pools
  myCertificates: [CourseCertificate!]! @aws_cognito_user_pools
  myCourseProgress(courseId: ID!): CourseProgress! @aws_cognito_user_pools
  myCourses: [Course!]! @aws_cognito_user_pools
  myExamAttempt(courseId: ID!): ExamAttempt @aws_cognito_user_pools
  myLearning: [CourseLearningSummary!]! @aws_cognito_user_pools
  myLessons: [Lesson!]! @aws_cognito_user_pools
  myModules: [Module!]! @aws_cognito_user_pools
  mySubmissionsForCourse(courseId: ID!): [AssignmentSubmission!]! @aws_cognito_user_pools
  organization(id: ID!): Organization @aws_cognito_user_pools
  organizationBySlug(slug: String!): Organization @aws_cognito_user_pools
  publicCourses: [Course!]! @aws_cognito_user_pools
  submissionsForAssignment(assignmentId: ID!, courseId: ID!): [AssignmentSubmission!]! @aws_cognito_user_pools
}

type QuizQuestion {
  correctIndex: Int!
  id: ID!
  options: [String!]!
  question: String!
}

type Subscription {
  organizationMemberJoined(organizationId: ID!): OrganizationMembership @aws_cognito_user_pools @aws_subscribe(mutations : ["acceptInvitation"])
}

type User {
  avatarUrl: AWSURL
  createdAt: AWSDateTime!
  email: AWSEmail!
  firstName: String
  id: ID!
  instructorStatus: InstructorStatus
  lastName: String
  organizations: [OrganizationMembership!]!
  status: UserStatus!
  updatedAt: AWSDateTime!
}

enum CourseStatus {
  DRAFT
  PUBLISHED
}

enum InstructorStatus {
  APPROVED
  PENDING
  REJECTED
}

enum InvitationStatus {
  ACCEPTED
  EXPIRED
  PENDING
}

enum LessonType {
  ANIMATION
  AUDIO
  DOCUMENT
  EMBED
  FLASHCARDS
  QUIZ
  TEXT
  VIDEO
}

enum MediaType {
  AUDIO
  DOCUMENT
  IMAGE
  VIDEO
}

enum MembershipRole {
  ADMIN
  INSTRUCTOR
  MEMBER
  OWNER
}

enum MembershipStatus {
  ACTIVE
  INVITED
  REMOVED
}

enum OrganizationStatus {
  ACTIVE
  PENDING
  SUSPENDED
}

enum OrganizationType {
  COMPANY
  GOVERNMENT
  NGO
  OTHER
  SCHOOL
}

enum SubmissionStatus {
  GRADED
  SUBMITTED
}

enum UserStatus {
  ACTIVE
  SUSPENDED
}

input CreateAssignmentInput {
  description: String
  title: String!
}

